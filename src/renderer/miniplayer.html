<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Resonance Mini</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0b10; color: #f0f0f5;
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    -webkit-app-region: drag; user-select: none;
  }
  .mini-stage { position: relative; flex: 1; height: 60px; min-width: 0; }
  .mini-layer {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 10px;
    background: #0b0b10;
  }
  .mini-layer-new { clip-path: url(#waveClip); will-change: clip-path; }
  .mini-art { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #1a1a22; flex-shrink: 0; }
  .mini-meta { min-width: 0; flex: 1; }
  .mini-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-artist { font-size: 11.5px; color: #9a9aa8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
  .bar-track { height: 3px; background: #23232d; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: #8b5cf6; width: 0%; }
  .controls { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; flex-shrink: 0; }
  button {
    background: none; border: none; color: #f0f0f5; font-size: 15px; cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, transform .12s ease;
  }
  button:hover { background: #1a1a22; }
  button:active { transform: scale(0.9); }
  #playBtn { font-size: 17px; }
  #closeBtn { font-size: 13px; color: #9a9aa8; margin-left: 4px; }
  #closeBtn:hover { background: #e5484d; color: #fff; }
  body { animation: miniIn .22s cubic-bezier(.16,1,.3,1); }
  @keyframes miniIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div class="mini-stage" id="miniStage">
    <div class="mini-layer" id="layerOld">
      <img class="mini-art" id="artOld" src="" alt="" />
      <div class="mini-meta">
        <div class="mini-title" id="titleOld">Nothing playing</div>
        <div class="mini-artist" id="artistOld">—</div>
        <div class="bar-track"><div class="bar-fill" id="barFillOld"></div></div>
      </div>
    </div>
    <div class="mini-layer mini-layer-new" id="layerNew">
      <img class="mini-art" id="artNew" src="" alt="" />
      <div class="mini-meta">
        <div class="mini-title" id="titleNew"></div>
        <div class="mini-artist" id="artistNew"></div>
        <div class="bar-track"><div class="bar-fill" id="barFillNew"></div></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prevBtn" title="Previous">⏮️</button>
    <button id="playBtn" title="Play/Pause">▶️</button>
    <button id="nextBtn" title="Next">⏭️</button>
    <button id="closeBtn" title="Close mini player">✕</button>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="waveClip" clipPathUnits="objectBoundingBox">
        <path id="wavePath" d="M0,0 L0,0 L0,1 L0,1 Z" />
      </clipPath>
    </defs>
  </svg>

<script src="miniplayer.js"></script>
</body>
</html>
